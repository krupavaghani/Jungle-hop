name: jungle_jumpping
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.6+6

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  audioplayers: ^5.2.1
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+5
  cloud_firestore: ^5.6.12
  device_info_plus: ^12.4.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: FredokaOne
      fonts:
        - asset: assets/fonts/FredokaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

  assets:
    - assets/fonts/
    - assets/images/
    - assets/audio/
